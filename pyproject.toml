[project]
name = "aaif-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["lxml", "rdflib"]

[dependency-groups]
dev = ["ruff", "pre-commit"]

# Explicit, because uv treats a project as a package by default; omitting
# [build-system] alone no longer keeps the repository out of the build path.
[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]  # line length is the formatter's business
# deliberately not active: D (free-prose docstrings), TRY/EM/BLE
# (skip-and-log-and-collect, no exception hierarchy), ANN not globally
